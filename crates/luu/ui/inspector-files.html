<script :setup>
  // The workspace tree. Lazy per directory, because a repository with a
  // `target/` in it is not one to walk eagerly, and because the endpoint is
  // one directory wide for the same reason. See
  // `RECORD/2026-09-15.a-three-pane-inspector.completed.md`.
  const { workspace, openDir, toggleDir, refresh, showFile, loadStatus, loadIcons, iconFor } =
    await import("./workspace.js")

  // Rooted at the folder somebody chose, which is a subdirectory of the one
  // `luu serve` was started in. Paths stay relative to *that* base throughout —
  // the root decides where the tree starts, not how a file is addressed. See
  // `RECORD/2026-09-16.three-columns-that-each-have-a-footer.completed.md`.
  openDir(workspace.root || "")
  loadStatus()
  loadIcons()

  // The tree, flattened to what is actually on screen: one pass that walks
  // only the directories that are expanded, carrying a depth for the indent.
  // A recursive component would need one instance per node to say the same
  // thing.
  const flatten = (path, depth, out) => {
    for (const entry of workspace.open[path] || []) {
      // The icon id is resolved in the pass rather than in the template, where
      // it took two calls per row — one for the `:if`, one for the `src`. A
      // `null` here is what selects the page's own shape, and it means *this
      // row has no theme icon*, which is not the same question as *is a theme
      // loaded*: a theme that declares no `file` default answers null too.
      const open = !!entry.dir && !!workspace.expanded[entry.path]
      out.push({ ...entry, depth, open, icon: iconFor(entry.name, entry.dir, open) })
      if (entry.dir && workspace.expanded[entry.path]) {
        flatten(entry.path, depth + 1, out)
      }
    }
    return out
  }
  // `workspace.icons` is in the list because the manifest arrives after the
  // first listing does — without it the tree would keep the shapes it resolved
  // in the moment before the theme loaded.
  $: rows = (workspace.open, workspace.expanded, workspace.icons,
             flatten(workspace.root || "", 0, []))

  $: selectedPath = workspace.selected?.kind === "file" ? workspace.selected.path : null
</script>

<div class="head">
  <h2>Files</h2>
  <button type="button" class="link" @click="refresh()" title="Re-read the tree and git">
    <svg class="ic"><use href="#i-refresh"/></svg>
  </button>
</div>

<p :if="workspace.error" class="err">{{ workspace.error }}</p>

<ul class="tree">
  <!-- The row is the `<li>`, not a button. It has to hold three controls — the
       one that opens the thing, git's letter, and the edit icon — and a
       `<button>` cannot hold another button: jq79 builds templates with
       `createElement`, which nests them happily, and then one click fires both
       handlers. See
       `RECORD/2026-09-16.the-tree-makes-room-for-an-icon.completed.md`. -->
  <li
    :each="row in rows"
    :key="row.path"
    class="node"
    :class.on="row.path === selectedPath"
    :class.ignored="row.ignored"
    :attrs="{ style: `--depth:${row.depth}` }">
    <button
      type="button"
      class="row"
      :attrs="{ title: row.path }"
      @click="row.dir ? toggleDir(row.path) : showFile(row.path)">
      <span class="twist">
        <svg :if="row.dir" class="ic" :class.open="row.open"><use href="#i-caret"/></svg>
      </span>
      <!-- The theme's own art where the theme has some, and this page's two
           shapes where it has none. Never both — and the condition is the row's
           own icon rather than `icons.loaded`, or a theme that declares no
           default would leave the row with neither and lose its 16px box. -->
      <img
        :if="row.icon"
        class="icon"
        :src="`./api/icons/${row.icon}?r=${workspace.icons.revision || 0}`"
        :attrs="{ alt: '', loading: 'lazy' }">
      <svg :if="!row.icon" class="ic glyph"><use :attrs="{ href: row.dir ? '#i-folder' : '#i-file' }"/></svg>
      <span class="name">{{ row.name }}</span>
    </button>
    <!-- Git's own letter, not a word: `M`, `??`, `A` are what `git status`
         says, and a person reading this panel already knows them. It no longer
         needs `margin-left: auto` — the button beside it is `flex: 1`, so what
         pushes these two right is the name's own greed. -->
    <span :if="row.status" class="status" :class="row.status.trim()">{{ row.status }}</span>
    <button
      type="button"
      class="edit"
      :attrs="{ title: `Edit ${row.name}` }"
      @click="showFile(row.path)">
      <svg class="ic"><use href="#i-edit"/></svg>
    </button>
  </li>
</ul>

<p :if="!rows.length && !workspace.error" class="dim">Reading the workspace…</p>

<style scoped>
  .head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .4rem; }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0;
  }
  .head .link { margin-left: auto; display: flex; text-decoration: none; color: var(--dim); }
  .head .link .ic { width: 14px; height: 14px; }
  .head .link:hover { color: var(--fg); }

  .tree { list-style: none; margin: 0; padding: 0; }

  /* The whole row: what is hovered, what is selected, and what the three
     controls sit in. The background lives here rather than on the button, so
     that the edit icon is inside the highlight rather than beside it. */
  .node {
    display: flex;
    align-items: center;
    border-radius: 4px;
  }
  .node:hover { background: var(--bg); }
  /* A tint rather than the accent filled in: the row is content somebody
     picked, not a control that is pressed, and a 20rem rail of saturated bars
     read as a toolbar. The token keeps the highlight on its own theme's side
     of the scale instead of crossing to the opposite end the way a filled
     `--accent` has to — see the token's own note in `app.css`. Text stays
     `--fg`, which is what lets the glyph, the caret and git's letter keep
     their own colours rather than all turning `--on-accent`. */
  .node.on { background: var(--selected); }
  /* Selected *and* hovered used to be the selected colour exactly, so the
     pointer stopped meaning anything over the one row it is most likely to be
     on. */
  .node.on:hover { background: var(--selected-hover); }

  .row {
    display: flex;
    /* Centred, not baseline: most of this row is a 16px box and an SVG's
       baseline is its bottom edge, which would hang every icon a few pixels
       below the name it belongs to. */
    align-items: center;
    gap: .25rem;
    /* Greedy, so the two controls after it are pushed to the right edge
       without either of them having to claim it with `margin-left: auto` —
       which is what the git letter used to do, and what an edit icon to its
       right would then have had to fight. */
    flex: 1;
    /* Or the name cannot shrink below its text and the ellipsis never runs. */
    min-width: 0;
    background: none;
    border: 0;
    /* Inherited, so `.node.on` recolours the text without a second rule. */
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: .1rem .3rem;
    /* The indent is a depth, and the arithmetic belongs here rather than in a
       style attribute the template recomputes per row. */
    padding-left: calc(var(--depth) * .75rem + .2rem);
    cursor: pointer;
    text-align: left;
  }
  /* There was no focus style at all: tabbing through the tree moved an
     invisible cursor. */
  .row:focus-visible, .edit:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    border-radius: 4px;
  }

  /* Dimmed, not hidden: somebody looking for `target/` wants to see that it is
     there and ignored rather than wonder whether the tree is broken. The icon
     dims with the name — dimming one and not the other read as a half-loaded
     row. */
  .node.ignored .name,
  .node.ignored .icon,
  .node.ignored .glyph { opacity: .45; }

  .twist { width: 14px; flex: none; display: flex; justify-content: center; color: var(--dim); }
  .twist .ic { width: 12px; height: 12px; }
  .icon { width: 16px; height: 16px; flex: none; }
  /* The fallback, and still deliberately not a second icon set: two shapes,
     enough that an unconfigured tree reads as intentional. `[ui] icon-theme`
     in config.toml replaces them with any VSCode icon theme on this machine. */
  .glyph { color: var(--dim); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status {
    flex: none;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    color: var(--warn);
    white-space: pre;
    padding: 0 .1rem;
  }
  /* Untracked is the one that reads differently from "changed": nothing of it
     is in git yet. */
  .status.\?\? { color: var(--b-history); }

  /* **The slot is always there; only its contents come and go.** Letting the
     icon in and out of the flow moves the name 241px → 221px, which re-runs
     the ellipsis on the one row somebody is pointing at. Measured — see the
     record. The cost is 20px of name on every row, which is the trade VSCode
     makes too. */
  .edit {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 4px;
    color: inherit;
    cursor: pointer;
    opacity: 0;
    /* Invisible *and* unclickable: an icon at 0 opacity that still takes
       clicks is a control nobody can see being pressed by accident. */
    pointer-events: none;
  }
  .edit .ic { width: 13px; height: 13px; }
  /* The pointer reveals it — and so does the keyboard, because an action that
     exists only on hover is an action a keyboard cannot find. */
  .node:hover .edit,
  .edit:focus-visible { opacity: 1; pointer-events: auto; }
  .edit:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }

  .err { color: var(--bad); font-size: 12px; line-height: 1.5; }
</style>
