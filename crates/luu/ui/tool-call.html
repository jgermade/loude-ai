<script :setup="{ part = null, live = false }">
  // One tool call in the chat, where the model wrote it — in place of the
  // ```tool block the text carries. `part` is a segment out of
  // `segments.js`: the call the block became, or only what the block says.
  //
  // One line that says what was asked and how it went, and the rest behind a
  // click: a person scanning a turn wants to see *read AGENTS.md, 3 ms* and
  // not forty lines of it. The raw block stays in the inspector, which is the
  // place for what the model sent. See
  // `RECORD/2026-09-29.a-switch-that-does-not-wait.completed.md`.

  let open = false

  $: call = part?.call || null
  $: args = part?.arguments || {}
  // The one argument that says what a call is about, per tool — a path, a
  // command line — and the first string argument for a tool this list does
  // not know yet.
  $: subject = Array.isArray(args.argv)
    ? args.argv.join(" ")
    : typeof args.path === "string"
      ? args.path
      : Object.values(args).find(v => typeof v === "string") || ""
  $: status = part?.pending
    ? { word: "writing the call…", kind: "busy" }
    : !call
      ? { word: live ? "waiting…" : "not run", kind: live ? "busy" : "dim" }
      : !call.verdict
        ? { word: "running…", kind: "busy" }
        : !call.verdict.allowed
          ? { word: "denied", kind: "bad" }
          : call.error
            ? { word: "failed", kind: "bad" }
            : call.command && call.command.exit_code !== 0
              ? { word: call.command.exit_code === null ? "killed" : `exit ${call.command.exit_code}`, kind: "bad" }
              : { word: "done", kind: "ok" }
  $: took = call?.duration_ms != null ? `${call.duration_ms} ms` : ""
  $: detailed = !part?.pending && (call || part?.raw)
  $: pretty = JSON.stringify(args, null, 2)
</script>

<div class="call" :class.open="open">
  <button type="button" class="head" :disabled="!detailed" @click="open = !open"
          :title="call?.verdict?.rule || ''">
    <svg :if="detailed" class="ic caret" :class.open="open"><use href="#i-caret"/></svg>
    <span class="dot" :class="status.kind"></span>
    <b class="name">{{ part?.name || "tool" }}</b>
    <span class="subject">{{ subject }}</span>
    <span class="status" :class="status.kind">{{ status.word }}</span>
    <span :if="took" class="took">{{ took }}</span>
  </button>

  <div :if="open" class="body">
    <div :if="call?.verdict" class="line">
      <span :class="call.verdict.allowed ? 'ok' : 'bad'">{{ call.verdict.allowed ? "allowed" : "denied" }}</span>
      <span class="dim">— {{ call.verdict.rule }}</span>
    </div>
    <div :if="call?.error" class="line bad">{{ call.error }}</div>
    <div class="label">arguments</div>
    <pre>{{ pretty }}</pre>
    <div :if="call?.command?.stderr" class="label">stderr</div>
    <pre :if="call?.command?.stderr" class="bad">{{ call.command.stderr }}</pre>
    <div :if="call?.output" class="label">
      output <span class="dim">· {{ call.output.length }} bytes</span>
      <span :if="call.truncated" class="warn">· cut</span>
    </div>
    <pre :if="call?.output">{{ call.output }}</pre>
    <div :if="!call && part?.raw" class="label">what the model wrote</div>
    <pre :if="!call && part?.raw">{{ part.raw }}</pre>
  </div>
</div>
