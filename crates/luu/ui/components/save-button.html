<script :setup="{ action = null, changes = 0, disabled = false, label = 'Save' }">
  // A save button that says how much it would save and whether it did.
  //
  // - `changes` is a count the caller works out. Above zero it rides on the
  //   button, and at zero the button is off, because there is nothing to write.
  // - `action` is the caller's save, called on click and awaited. **Truthy
  //   means it was written**: the label turns into a tick that draws itself, and
  //   the button says `saved` until the next change. Falsy leaves the button as
  //   it was, since the caller is the one that knows what to say about a refusal.
  //
  // The tick is rare-ui's `delete-button` confirmation; the code is not.
  // **Self-contained**, like everything in `components/`. See
  // `RECORD/2026-09-28.components-of-our-own.completed.md`.
  //
  //   <SaveButton :action="save" :changes="changed" :disabled="!editable" />

  let busy = false
  // Set by a save that worked. It only shows while nothing has changed since:
  // the next edit brings the count back instead.
  let done = false

  const run = async () => {
    if (busy || !action) return
    busy = true
    done = false
    let ok = false
    try {
      ok = !!(await action())
    } finally {
      busy = false
    }
    done = ok
    $emit(ok ? "saved" : "failed")
  }

  $: saved = done && !changes
  $: off = disabled || busy || (!changes && !done) || saved
</script>

<button
  type="button"
  class="save"
  :class.busy="busy"
  :class.saved="saved"
  :disabled="off"
  :aria-label="saved ? 'Saved' : null"
  @click="run()">
  <span class="label">{{ busy ? "Saving…" : label }}</span>
  <span class="count" :if="changes > 0 && !busy">{{ changes }}</span>
  <svg class="tick" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 12.5 9.5 18 20 7" />
  </svg>
</button>
