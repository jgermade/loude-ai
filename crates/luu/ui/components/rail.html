<script :setup="{ items = [], model = '' }">
  // A vertical list of sections with a bar in the accent colour beside the
  // chosen one, springing to it. It was a dot; a bar says *this one* by standing
  // beside the whole item rather than beside its middle. No line joins the
  // others: only the chosen one is marked. The chosen label is the only one at full colour. The
  // idea is rare-ui's `bounce-sidebar`; the code is not.
  //
  // **Self-contained**, like everything in `components/`: it imports nothing
  // from the page, and what an item looks like is the caller's, through the
  // slot — so an icon sprite the page owns stays the page's. See
  // `RECORD/2026-09-28.components-of-our-own.completed.md`.
  //
  //   <Rail :items="[{ value: 'a', label: 'A' }]" :model="section" :slot="{ item }">
  //     <b>{{ item.label }}</b>
  //   </Rail>
  //
  // Without a slot an item draws its `label`. The choice goes back up through
  // `:model` when the tag binds one, and always as `change`.

  // Where the accent stretch is — the chosen item's top and height, in the
  // rail's own pixels — or `null` before the first measurement. `moving` is the
  // same first-placement rule as `segmented.html`: it appears where it belongs
  // and only moves after.
  let at = null
  let moving = false

  const place = () => {
    const on = $self("button.on")
    if (!on || !on.offsetHeight) return
    at = { y: on.offsetTop, h: on.offsetHeight }
    if (!moving) requestAnimationFrame(() => { moving = true })
  }

  const choose = item => {
    if (item.value === model) return
    $updateModel(item.value)
    $emit("change", item.value)
  }

  await $mounted()
  new ResizeObserver(() => place()).observe($self(".rail"))
  $: (model, items, requestAnimationFrame(place))
  $: mark = at === null ? "display:none" : `height:${at.h}px;transform:translateY(${at.y}px)`
</script>

<nav class="rail" :class.moving="moving">
  <span class="mark" :style="mark" aria-hidden="true"></span>
  <button
    :each="item in items"
    :key="item.value"
    type="button"
    :class.on="item.value === model"
    :aria-current="item.value === model ? 'page' : null"
    @click="choose(item)">
    <slot :item="item">{{ item.label }}</slot>
  </button>
</nav>
