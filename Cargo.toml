[workspace]
resolver = "3"
members = ["crates/agent-core", "crates/luu"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jgermade/luu"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
clap = { version = "4", features = ["derive"] }
# Signed approvals. The one thing here not to hand-roll: the randomness for a new
# key is read from /dev/urandom and the hex is written by hand, because those two
# are small enough that a dependency costs more than the code. See
# RECORD/2026-09-04.signed-approvals.completed.md.
ed25519-dalek = "3"
futures-util = "0.3"
# Gitignore-aware directory walking for the debug UI's file tree. The
# alternative was a matcher over the root `.gitignore` by hand, which gets
# nested ignore files, negations and the global config wrong -- this crate is
# ripgrep's own walker and already implements all of it. See
# RECORD/2026-09-15.a-three-pane-inspector.completed.md.
ignore = "0.4"
landlock = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
mime_guess = "2"
# `include-exclude` is what lets the UI folder keep a gitignored
# `node_modules` — Monaco is a node dependency of it, served from disk rather
# than baked into a release binary. See `serve::Ui`.
rust-embed = { version = "8", features = ["include-exclude"] }
# `bundled`: SQLite compiled in, so the store does not depend on what the host
# happens to have installed. Local-first applied to the one dependency that
# would otherwise be a system package.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seccompiler = "0.5"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio-tungstenite = "0.30"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-highlight = "0.27"
# One grammar per language the viewer highlights. Breadth over "only what this
# repo is written in": the viewer is useful against whatever checkout someone
# points `luu` at, which is the point of it. See
# RECORD/2026-09-15.a-three-pane-inspector.completed.md.
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time"] }
toml = "1"
