name: build

on:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the caller's ref.
        type: string
        default: ""
      pages:
        description: Assemble and upload the GitHub Pages artifact.
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="dist/luu-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/luu" "$out/"
          cp README.md "$out/" 2>/dev/null || true
          tar -czf "dist/luu-${{ matrix.target }}.tar.gz" -C dist "luu-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: luu-${{ matrix.target }}
          path: dist/luu-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Level 3, run rather than described. Every contained run this repository had
  # until 2026-09-08 was Docker Desktop on macOS, by hand, once — and the runner
  # here is Linux with a real daemon, which is the platform the whole sandbox
  # ladder is aimed at. See RECORD/2026-09-03.the-container-observed.completed.md
  # and scripts/container-check.sh, which is the same walk a person takes.
  container:
    needs: test
    runs-on: ubuntu-latest
    # The image build is the long pole and it is minutes, not tens of them: a
    # step that runs longer than this is wedged, and a wedged job that waits out
    # the six-hour default is one nobody sees fail.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin luu

      - name: The image, the handshake, and the same calls inside and out
        run: LUU_BIN=target/release/luu scripts/container-check.sh

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The UI has no build step — it is jq79 plus .html components, served as
      # they are. What CI produces is the recordings and the static twin of the
      # read API, and it produces both by running the agent, so neither can
      # drift from what the live server would answer.
      - run: cargo build --release --locked --bin luu

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          # Everything but the optional node dependencies: Monaco is installed
          # into `web/node_modules` by `make install` and served from
          # disk by the binary, never shipped — the static twin has no server
          # behind it and offers this page's own viewer either way. See
          # RECORD/2026-09-16.three-columns-that-each-have-a-footer.completed.md.
          tar -c -C web \
            --exclude=node_modules --exclude=package-lock.json . | tar -x -C site
          ./scripts/make-fixtures.sh ./target/release/luu site/fixtures

      - name: Check the site is self-contained
        run: |
          set -euo pipefail
          # A CDN reference here would work locally and break the moment the
          # binary is offline — which is the case the embedded UI exists for.
          if grep -rInE 'https?://(cdn|unpkg|esm|fonts)\.' site/ ; then
            echo "::error::the site must not reference external hosts"
            exit 1
          fi
          test -s site/vendor/jq79.js
          # The static API must exist and be shaped like the live one. A deploy
          # whose API is missing looks fine until someone opens it.
          test -s site/api/sessions.json
          python3 - <<'PY'
          import json, pathlib
          sessions = json.loads(pathlib.Path("site/api/sessions.json").read_text())
          assert sessions, "no sessions exported"
          for session in sessions:
              root = pathlib.Path("site/api/sessions") / session["id"]
              assert (root.parent / f"{session['id']}.json").is_file()
              turns = json.loads((root / "turns.json").read_text())
              assert len(turns) == session["turns"]
              for turn in turns:
                  assert (root / "turns" / f"{turn['turn']}.json").is_file()
                  assert (root / "turns" / str(turn["turn"]) / "prompt.json").is_file()
              assert pathlib.Path("site" + session["record"].lstrip(".")).is_file(), session["record"]
          print(f"{len(sessions)} sessions exported, all files present")
          PY

      # The page, opened. Everything above this line checks that files exist and
      # parse; only this one loads the site in a browser, and it is the only
      # test in CI that would notice a component that stopped mounting or a
      # fixture the store cannot read. Node lives here and nowhere else:
      # `cargo build` must not require it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tests/smoke/package-lock.json
            web/package-lock.json
      - name: Smoke-test the page
        working-directory: tests/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # The other half of the page: the socket, the gate, an approval and a
      # tool call, against a live `luu serve` on the mock. The static twin above
      # has no server behind it, so it cannot reach any of them — and every UI
      # bug this repository has had lived exactly there.
      # The page's optional dependencies, as `make install` fetches them:
      # xterm.js, which draws the terminal panel, and Monaco. The live server
      # serves them from disk, and without them the terminal panel only says
      # how to install it — so the tests that open a shell on the host failed
      # here from the day they were written, and passed on every machine that
      # had run `make install`. After the site is assembled, which leaves
      # `node_modules` out: the static twin stays the page without them.
      - name: The page's optional dependencies
        working-directory: web
        run: npm ci

      - name: Smoke-test the gate against a live server
        working-directory: tests/smoke
        env:
          LUU_BIN: target/release/luu
        run: npx playwright test -c gate.config.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            tests/smoke/test-results
            tests/smoke/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error

      - uses: actions/configure-pages@v5
        if: ${{ inputs.pages }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.pages }}
        with:
          path: site
