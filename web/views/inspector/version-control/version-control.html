<script :setup>
  // What git says changed, as a list you click to see the diff in the middle
  // column. Read-only: nothing here stages, commits or reverts — see
  // `RECORD/2026-09-15.a-three-pane-inspector.completed.md` on why this panel is a
  // window and not a second way to change the workspace.
  const { workspace, loadStatus, showDiff, inside } = await import("@web/lib/workspace.js")

  loadStatus()

  // Git's `XY` code is two positions, not one word: X is the index against
  // HEAD and Y the working tree against the index. Splitting them is what
  // decides which diff a click should ask for.
  //
  // Narrowed to the chosen folder here rather than by a second parameter on the
  // endpoint: it is one `git status --porcelain` for a repository either way,
  // and a parameter would be a second thing to keep consistent with the root.
  // `where` is what the row *shows*, relative to that folder; `path` stays
  // relative to the base, because that is what the diff is asked for by.
  $: changes = (workspace.root, Object.entries(workspace.status))
    .filter(([path]) => inside(path) !== null)
    .map(([path, code]) => {
      const padded = code.padEnd(2, " ")
      const untracked = code.trim() === "??"
      const shown = inside(path) || ""
      return {
        path,
        code,
        name: path.split("/").pop(),
        dir: shown.includes("/") ? shown.slice(0, shown.lastIndexOf("/")) : "",
        untracked,
        staged: !untracked && padded[0] !== " ",
        unstaged: !untracked && padded[1] !== " ",
      }
    })
    .sort((a, b) => a.path.localeCompare(b.path))

  // Not `selected` — that name collides with the DOM property and loops
  // the render effect. See `views/editor/editor.html`.
  $: picked = workspace.selected?.kind === "diff" ? workspace.selected : null
</script>

<div class="head">
  <h2>Git</h2>
  <button type="button" class="link" @click="loadStatus()" title="Ask git again">
    <svg class="ic"><use href="#i-refresh"/></svg>
  </button>
</div>

<p :if="workspace.gitError" class="err">{{ workspace.gitError }}</p>

<ul class="changes">
  <li :each="change in changes" :key="change.path">
    <button
      type="button"
      class="row"
      :class.on="picked?.path === change.path"
      :title="change.path"
      @click="showDiff(change.path, change.staged && !change.unstaged)"
      @dblclick="showDiff(change.path, change.staged && !change.unstaged, { pinned: true })">
      <span class="code" :class.new="change.untracked">{{ change.code }}</span>
      <span class="name">{{ change.name }}</span>
      <span :if="change.dir" class="where dim">{{ change.dir }}</span>
    </button>
  </li>
</ul>

<p :if="!changes.length && !workspace.gitError" class="dim">
  Nothing changed — the working tree matches <code>HEAD</code>.
</p>

<p :if="changes.length" class="legend dim">
  Two positions, as git writes them: the index against <code>HEAD</code>, then
  the working tree against the index. <code>??</code> is untracked, and has no
  diff to show.
</p>
