<script :setup>
  // The terminal panel under the editor: a shell where the live session's
  // commands run, opened from the content column's foot. What lives here is
  // the box; the shell itself lives in `lib/terminal.js`, so hiding the panel
  // does not end it, and its controls are in the column's foot
  // (`terminal-foot.html`), under it. Dark whatever the page is: a shell's
  // colours are written for a dark ground. See
  // `RECORD/2026-10-01.a-terminal-in-the-container.completed.md` and
  // `RECORD/2026-10-01.the-terminal-follows-the-session.completed.md`.
  const { terminal, attach } = await import("@web/lib/terminal.js")

  await $mounted()
  // The host is a plain element xterm draws into, attached by hand for the
  // reason Monaco's is: the renderer owns whether the box exists, and nothing
  // inside it.
  const draw = (frames = 120) => {
    const host = $self(".host")
    if (!host?.isConnected) {
      if (frames > 0) requestAnimationFrame(() => draw(frames - 1))
      return
    }
    attach(host)
  }
  draw()
</script>

<section class="terminal">
  <p :if="terminal.moveError" class="warn note">{{ terminal.moveError }}</p>
  <p :if="terminal.info && !terminal.info.available" class="dim note">{{ terminal.info.reason }}</p>
  <p :if="terminal.info?.available && !terminal.info?.xterm" class="dim note">
    The terminal is drawn by xterm.js, an optional dependency of the page, and
    this checkout does not have it: run <code>make install</code> (or
    <code>npm install</code> in <code>web/</code>) and reload.
  </p>
  <div class="host"></div>
</section>
