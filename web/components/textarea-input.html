<script :setup="{
  model = undefined,
  value = '',
  placeholder = '',
  rows = 2,
  disabled = false,
  readonly = false,
  resize = 'vertical',
  warn = false,
  invalid = false,
  id = '',
  name = ''
}">
  // A multiline text input with unified borders, focus ring, and resize options.
  //
  // **Self-contained**, like everything in `components/`: imports nothing.
  //
  //   <TextareaInput :model="draftText" rows="3" placeholder="Notes..." />

  $: val = (model !== undefined && model !== null) ? model : value

  const onInput = event => {
    const v = event.target.value
    $updateModel(v)
    $emit("input", v)
  }

  const onChange = event => {
    const v = event.target.value
    $emit("change", v)
  }
</script>

<div class="textarea-wrap"
     :class.warn="warn"
     :class.invalid="invalid"
     :class.disabled="disabled"
     :class.readonly="readonly">
  <textarea
    :rows="rows"
    :placeholder="placeholder"
    :disabled="disabled"
    :readonly="readonly"
    :style="resize ? `resize:${resize}` : ''"
    :id="id || null"
    :name="name || null"
    :value="val"
    @input="onInput($event)"
    @change="onChange($event)"
    @focus="$emit('focus', $event)"
    @blur="$emit('blur', $event)"></textarea>
</div>
