<script :setup="{
  model = undefined,
  checked = false,
  disabled = false,
  label = '',
  description = '',
  name = '',
  id = ''
}">
  // An accessible, styled checkbox with an animated SVG tick and slot support.
  //
  // **Self-contained**, like everything in `components/`: imports nothing.
  //
  //   <Checkbox :model="makeDefault" label="what every run sends to" />
  //   <Checkbox :model="withProvider">
  //     also add a provider <strong>{{ name }}</strong>
  //   </Checkbox>

  $: isOn = (model !== undefined && model !== null) ? !!model : !!checked

  const onChange = event => {
    const v = event.target.checked
    $updateModel(v)
    $emit("change", v)
  }
</script>

<label class="check-root"
       :class.disabled="disabled"
       :class.checked="isOn">
  <input
    type="checkbox"
    class="sr-input"
    :checked="isOn"
    :disabled="disabled"
    :name="name || null"
    :id="id || null"
    @change="onChange($event)">
  <span class="box" aria-hidden="true">
    <svg class="tick" viewBox="0 0 24 24">
      <path d="M4.5 12.5 9.5 17.5 19.5 6.5" />
    </svg>
  </span>
  <span class="text" :if="label || description">
    <span :if="label" class="label">{{ label }}</span>
    <slot></slot>
    <span :if="description" class="desc">{{ description }}</span>
  </span>
  <span :if="!label && !description" class="text">
    <slot></slot>
  </span>
</label>
