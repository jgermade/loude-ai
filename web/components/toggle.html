<script :setup="{
  model = undefined,
  checked = false,
  disabled = false,
  label = '',
  description = '',
  size = ''
}">
  // A sliding switch control for boolean options.
  //
  // **Self-contained**, like everything in `components/`: imports nothing.
  //
  //   <Toggle :model="enabled" label="Enable feature" />

  $: isOn = (model !== undefined && model !== null) ? !!model : !!checked

  const toggle = () => {
    if (disabled) return
    const next = !isOn
    $updateModel(next)
    $emit("change", next)
  }

  const onKey = event => {
    if (disabled) return
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault()
      toggle()
    }
  }
</script>

<label class="toggle-root"
       :class.disabled="disabled"
       :class.on="isOn"
       :class.small="size === 'small'">
  <button
    type="button"
    role="switch"
    class="track"
    :aria-checked="String(isOn)"
    :disabled="disabled"
    @click="toggle()"
    @keydown="onKey($event)">
    <span class="thumb" aria-hidden="true"></span>
  </button>
  <span class="text" :if="label || description" @click="toggle()">
    <span :if="label" class="label">{{ label }}</span>
    <slot></slot>
    <span :if="description" class="desc">{{ description }}</span>
  </span>
  <span :if="!label && !description" class="text" @click="toggle()">
    <slot></slot>
  </span>
</label>
