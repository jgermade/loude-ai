<script :setup="{
  model = undefined,
  value = '',
  type = 'text',
  placeholder = '',
  disabled = false,
  readonly = false,
  autofocus = false,
  inputmode = '',
  size = '',
  width = '',
  warn = false,
  invalid = false,
  clearable = false,
  prefix = '',
  suffix = '',
  id = '',
  name = '',
  list = ''
}">
  // A text input: single-line text, number, url, search or password with
  // unified borders, focus ring, affix labels and optional clear action.
  //
  // **Self-contained**, like everything in `components/`: imports nothing,
  // and tokens have fallbacks so it draws consistently anywhere.
  //
  //   <TextInput :model="name" placeholder="local" autofocus />
  //   <TextInput :model="port" size="num" placeholder="8080" />
  //
  // Two-way binding works through `:model` via `$updateModel`, or via `:value`
  // and `@input` / `@change`.

  $: val = (model !== undefined && model !== null) ? model : value

  const onInput = event => {
    const v = event.target.value
    $updateModel(v)
    $emit("input", v)
  }

  const onChange = event => {
    const v = event.target.value
    $emit("change", v)
  }

  const clear = () => {
    if (disabled || readonly) return
    $updateModel("")
    $emit("input", "")
    $emit("change", "")
    $self("input")?.focus()
  }
</script>

<div class="input-wrap"
     :class.small="size === 'small'"
     :class.num="size === 'num'"
     :class.has-warn="warn"
     :class.invalid="invalid"
     :class.disabled="disabled"
     :class.readonly="readonly"
     :style="width ? `width:${width}` : ''">
  <span :if="prefix" class="affix prefix">{{ prefix }}</span>
  <input
    :type="type"
    :value="val"
    :placeholder="placeholder"
    :disabled="disabled"
    :readonly="readonly"
    :autofocus="autofocus"
    :inputmode="inputmode || null"
    :id="id || null"
    :name="name || null"
    :list="list || null"
    @input="onInput($event)"
    @change="onChange($event)"
    @keydown="$emit('keydown', $event)"
    @focus="$emit('focus', $event)"
    @blur="$emit('blur', $event)">
  <button :if="clearable && val && !disabled && !readonly"
          type="button"
          class="clear-btn"
          tabindex="-1"
          title="Clear"
          @click="clear()">
    <svg class="clear-ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
  <span :if="suffix" class="affix suffix">{{ suffix }}</span>
</div>
