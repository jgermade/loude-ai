<script :setup="{ title = '', width = '', open = true, locked = false }">
  // A modal, as the element the platform already has: a `<dialog>` opened
  // with `showModal()` brings ESC, a focus trap, everything behind it made
  // inert, and a `::backdrop`. What it does *not* bring is the page's own
  // state, so every way out — the close button, a click on the backdrop, ESC,
  // `:open` going false — plays the same exit and then emits `close`, and the
  // owner unmounts it the way it always did.
  //
  // **Self-contained**, like everything in `components/`. See
  // `RECORD/2026-10-01.one-modal.completed.md`.
  //
  //   <Modal title="Add a provider" width="34rem" :open="open" @close="close?.()">
  //     <template :slot.head><span class="dim">beside the title</span></template>
  //     <section class="modal-body">…</section>
  //   </Modal>
  //
  // `:open` is for a script: a form that saved sets it false and leaves the
  // way a click on close does. `locked` refuses every dismissal and hides the
  // close button — the folder picker on a first visit, which has nothing
  // behind it to go back to. `width` is a length, capped at the window.
  //
  // **A modal opened inside another is its child, and stays inside it**: no
  // head of its own, a sheet that comes down out of the parent's head, and an
  // overlay over the parent's body only — the parent's head stays lit, so it
  // is still clear whose form this is. The provider and engine forms over
  // Settings are the case. It is still a `showModal()` dialog, so ESC, the
  // focus trap and the inert parent are the platform's; only where it is
  // drawn changes. The overlay is its `::backdrop`, fitted to the parent's
  // body, and a click on it is a click on the dialog, so it dismisses the
  // child like any backdrop.

  // How long it takes to leave; `modal-out` below is the same.
  const CLOSE_MS = 140
  let leaving = false

  // The parent dialog, when this one opened inside one, and the parent's
  // body in the viewport's pixels — where the sheet and its overlay go.
  let parent = null
  let room = null

  const fitted = (room, width) =>
    `--top:${room.top}px;--left:${room.left}px;--w:${room.width}px;--h:${room.height}px;` +
    `--box:min(${width || "34rem"}, ${room.width}px - 2rem)`
  $: box = parent && room ? fitted(room, width) : width ? `width:min(${width}, calc(100vw - 2rem))` : ""

  // There is no unmount here to stop listening on, so the first measurement
  // after this dialog has left the document stops it instead.
  let watching = null
  const fit = () => {
    if (!$self("dialog")?.isConnected) {
      watching?.disconnect()
      window.removeEventListener("resize", fit)
      return
    }
    if (!parent?.open) return
    const outer = parent.getBoundingClientRect()
    const head = parent.querySelector(":scope > .modal-head")?.getBoundingClientRect()
    const top = head ? head.bottom : outer.top
    room = {
      top,
      left: outer.left + parent.clientLeft,
      width: parent.clientWidth,
      height: outer.bottom - parent.clientTop - top,
    }
  }

  const close = () => {
    if (leaving || locked) return
    const dialog = $self("dialog")
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches
    if (!dialog?.open || still) return $emit("close")
    leaving = true
    setTimeout(() => $emit("close"), CLOSE_MS)
  }
  $: open || close()

  await $mounted()

  // Mounted is not the same as in the document: this renders inside its
  // owner's template, which may not be attached yet, and `showModal()` throws
  // on a dialog that is not connected. About two seconds of frames, which is
  // far longer than a template takes.
  const show = (frames = 120) => {
    const dialog = $self("dialog")
    if (!dialog?.isConnected) {
      if (frames > 0) requestAnimationFrame(() => show(frames - 1))
      return
    }
    if (dialog.open) return

    parent = dialog.parentElement?.closest("dialog.modal[open]") ?? null
    if (parent) {
      fit()
      watching = new ResizeObserver(fit)
      watching.observe(parent)
      window.addEventListener("resize", fit)
    }

    // `target` is checked because `close` is also the name this component
    // emits, and an emit bubbles: a modal opened from inside this one would
    // otherwise close both.
    //
    // ESC — and anything else the browser counts as a dismissal — fires
    // `cancel` first, and it is always refused: the browser would close at
    // once, with no exit to play.
    dialog.addEventListener("cancel", event => {
      if (event.target !== dialog) return
      event.preventDefault()
      close()
    })
    // Whatever else closed it, the owner is told rather than left holding a
    // mounted component that is invisible and owns the top layer.
    dialog.addEventListener("close", event => {
      if (event.target !== dialog) return
      if (locked) return dialog.showModal()
      close()
    })
    // A frame later for a child, so the box above is drawn — headless and
    // in its place — before it is on screen.
    if (parent) requestAnimationFrame(() => dialog.isConnected && !dialog.open && dialog.showModal())
    else dialog.showModal()
  }
  show()
</script>

<!-- `@click.self` is the backdrop: a click that lands on the dialog itself
     rather than on anything inside it is a click outside the box, because the
     dialog has no padding of its own for a click to land in. -->
<dialog class="modal" :class.closing="leaving" :class.child="!!parent" :style="box"
        :aria-label="title" @click.self="close()">
  <header :if="!parent" class="modal-head">
    <strong>{{ title }}</strong>
    <slot.head />
    <!-- An icon, and the word kept for whoever cannot see it. -->
    <button :if="!locked" type="button" class="close" title="Close" @click="close()">
      <svg class="ic"><use href="#i-close"/></svg><span class="unseen">close</span>
    </button>
  </header>
  <slot />
</dialog>

<style scoped>
  dialog {
    background: var(--tree-bg, #ededed);
    color: var(--fg, #1a1d23);
    /* Where the modal ends, like where a column does. */
    border: 1px solid var(--divider, #3a3a3a);
    border-radius: 6px;
    /* No padding, deliberately: padding would be a ring of "outside" inside
       the border for `@click.self` to read as the backdrop. */
    padding: 0;
    /* The viewport is a dialog's containing block, so the gutter is taken off
       explicitly. */
    width: min(72rem, calc(100vw - 2rem));
    max-width: calc(100vw - 2rem);
    margin: 3rem auto;
    max-height: calc(100vh - 6rem);
    flex-direction: column;
  }
  /* `display: none` until it is open: a `display: flex` that applied before
     `showModal()` would put the box on screen, unmodal, for a frame. */
  dialog[open] { display: flex; animation: modal-in .2s cubic-bezier(.2, .8, .2, 1); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog[open]::backdrop { animation: backdrop-in .2s ease-out; }
  dialog.closing { animation: modal-out .14s ease-in forwards; }
  dialog.closing::backdrop { animation: backdrop-out .14s ease-in forwards; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes modal-out { to { opacity: 0; transform: translateY(6px) scale(.985); } }
  @keyframes backdrop-in { from { opacity: 0; } }
  @keyframes backdrop-out { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    dialog[open], dialog[open]::backdrop, dialog.closing, dialog.closing::backdrop { animation: none; }
  }

  /* ---- a child: a sheet out of the parent's head, over the parent's body */
  dialog.child {
    inset: auto;
    top: var(--top);
    left: calc(var(--left) + (var(--w) - var(--box)) / 2);
    width: var(--box);
    max-width: none;
    margin: 0;
    max-height: calc(var(--h) - 2rem);
    /* Fastened to the head it comes out of: no top edge, square top corners. */
    border-top: 0;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
  }
  dialog.child::backdrop {
    inset: auto;
    top: var(--top);
    left: var(--left);
    width: var(--w);
    height: var(--h);
    background: rgba(0, 0, 0, .45);
    border-radius: 0 0 5px 5px;
  }
  dialog.child[open] { animation: sheet-in .26s cubic-bezier(.32, .72, 0, 1); }
  dialog.child.closing { animation: sheet-out .14s ease-in forwards; }
  /* Down out of the head's bottom edge: the part still above it is clipped, so
     it reads as coming from behind the head rather than over it. Both ends are
     an `inset()`, because one to `none` does not interpolate and snaps
     halfway; the negative sides leave the shadow out of the clip. */
  @keyframes sheet-in {
    from { transform: translateY(-100%); clip-path: inset(100% -2rem -2rem -2rem); }
    to { transform: none; clip-path: inset(0 -2rem -2rem -2rem); }
  }
  @keyframes sheet-out {
    from { transform: none; clip-path: inset(0 -2rem -2rem -2rem); }
    to { transform: translateY(-100%); clip-path: inset(100% -2rem -2rem -2rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    dialog.child[open], dialog.child.closing { animation: none; }
  }

  .modal-head {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem 1rem;
    border-bottom: 1px solid var(--line, #c8c8c8);
    /* Dark, like the columns' heads: under light it takes the dark palette
       (`app.css`), so this is its own ground and ink. Rounded with the box,
       which does not clip. */
    background: var(--panel);
    color: var(--fg);
    border-radius: 5px 5px 0 0;
  }
  .close {
    display: flex;
    margin-left: auto;
    background: none;
    border: 0;
    border-radius: 6px;
    color: var(--dim);
    padding: .25rem;
    cursor: pointer;
  }
  .close:hover { color: var(--fg); background: var(--bg); }
  .close .ic { width: 16px; height: 16px; }
  .unseen {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
