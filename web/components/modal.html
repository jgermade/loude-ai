<script :setup="{ title = '', width = '', open = true, locked = false, variant = '', animation = '', height = '' }">
  // A modal, as the element the platform already has: a `<dialog>` opened
  // with `showModal()` brings ESC, a focus trap, everything behind it made
  // inert, and a `::backdrop`. What it does *not* bring is the page's own
  // state, so every way out — the close button, a click on the backdrop, ESC,
  // `:open` going false — plays the same exit and then emits `close`, and the
  // owner unmounts it the way it always did.
  //
  // **Self-contained**, like everything in `components/`. See
  // `RECORD/2026-10-01.one-modal.completed.md`.
  //
  //   <Modal title="Add a provider" width="34rem" :open="open" @close="close?.()">
  //     <template :slot.head><span class="dim">beside the title</span></template>
  //     <section class="modal-body">…</section>
  //   </Modal>
  //
  // `:open` is for a script: a form that saved sets it false and leaves the
  // way a click on close does. `locked` refuses every dismissal and hides the
  // close button — the folder picker on a first visit, which has nothing
  // behind it to go back to. `width` is a length, capped at the window.
  //
  // **A modal opened inside another is its child, and stays inside it**: no
  // head of its own, a sheet that comes down out of the parent's head, and an
  // overlay over the parent's body only — the parent's head stays lit, so it
  // is still clear whose form this is. The provider and engine forms over
  // Settings are the case.
  //
  // **And the parent's head still works**: its close button closes both. So
  // a child is opened with `show()`, not `showModal()` — a second modal would
  // make everything under it inert, the parent's head included. The parent
  // stays the modal, and what the child takes over is done here instead: the
  // rest of the parent's content is made `inert` (all of it but the head and
  // the child), the overlay is an element of its own over the parent's body,
  // and ESC is caught before it reaches the parent, so it closes the child
  // alone.

  // How long it takes to leave; `folio-up` below is the same.
  const CLOSE_MS = 150
  let leaving = false

  // The parent dialog, when this one opened inside one, and the parent's
  // body in the viewport's pixels — where the sheet and its overlay go.
  let parent = null
  let room = null
  // What `veil` made inert, to give back.
  let veiled = []
  // A child's ESC, on the window; see `show`.
  let escape = () => {}

  // Everything in the parent but its head and the way down to this one:
  // at each level on the way up, the siblings that are not on it.
  const veil = (dialog, cover) => {
    for (let at = dialog; at && at !== parent; at = at.parentElement) {
      for (const sibling of at.parentElement?.children || []) {
        if (sibling === at || sibling === cover || sibling.inert) continue
        if (at.parentElement === parent && sibling.matches(".modal-head")) continue
        sibling.inert = true
        veiled.push(sibling)
      }
    }
  }
  const unveil = () => {
    for (const element of veiled) element.inert = false
    veiled = []
  }

  const fitted = (room, width) =>
    `--top:${room.top}px;--left:${room.left}px;--w:${room.width}px;--h:${room.height}px;` +
    `--box:min(${width || "34rem"}, ${room.width}px - 2rem)`
  $: isFolio = variant === "folio" || animation === "folio"
  $: explicitHeight = height || (isFolio ? "calc(100dvh - 4.5rem)" : "")
  $: box = parent && room
    ? fitted(room, width)
    : [
        width ? `width:min(${width}, calc(100vw - 2rem))` : "",
        explicitHeight ? `height:${explicitHeight};max-height:${explicitHeight}` : "",
      ].filter(Boolean).join(";")

  let watching = null
  const fit = () => {
    if (!parent?.open) return
    const outer = parent.getBoundingClientRect()
    const head = parent.querySelector(":scope > .modal-head")?.getBoundingClientRect()
    const cs = window.getComputedStyle(parent)
    const isContained = cs.transform !== "none" || cs.perspective !== "none" || cs.filter !== "none"
    const top = isContained
      ? (head ? head.bottom - outer.top : 0)
      : (head ? head.bottom : outer.top)
    const left = isContained ? 0 : (outer.left + parent.clientLeft)
    const borderB = outer.height - parent.clientHeight - parent.clientTop
    room = {
      top,
      left,
      width: parent.clientWidth,
      height: outer.bottom - borderB - (head ? head.bottom : outer.top),
    }
  }

  const close = () => {
    if (leaving || locked) return
    unveil()
    const dialog = $self("dialog")
    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches
    if (!dialog?.open || still) return $emit("close")
    leaving = true
    setTimeout(() => $emit("close"), CLOSE_MS)
  }
  $: open || close()

  await $mounted()

  // Mounted is not the same as in the document: this renders inside its
  // owner's template, which may not be attached yet, and `showModal()` throws
  // on a dialog that is not connected. About two seconds of frames, which is
  // far longer than a template takes.
  const show = (frames = 120) => {
    const dialog = $self("dialog")
    if (!dialog?.isConnected) {
      if (frames > 0) requestAnimationFrame(() => show(frames - 1))
      return
    }
    if (dialog.open) return

    parent = dialog.parentElement?.closest("dialog.modal[open]") ?? null
    if (parent) {
      fit()
      watching = new ResizeObserver(fit)
      watching.observe(parent)
      window.addEventListener("resize", fit)
      parent.addEventListener("animationend", fit)
      $destroyed(() => {
        watching.disconnect()
        window.removeEventListener("resize", fit)
        window.removeEventListener("keydown", escape, true)
        parent?.removeEventListener("animationend", fit)
        // However the child went — closed, or unmounted by its owner without
        // a close — the parent is given back.
        unveil()
      })
    }

    // `target` is checked because `close` is also the name this component
    // emits, and an emit bubbles: a modal opened from inside this one would
    // otherwise close both.
    //
    // ESC — and anything else the browser counts as a dismissal — fires
    // `cancel` first, and it is always refused: the browser would close at
    // once, with no exit to play.
    dialog.addEventListener("cancel", event => {
      if (event.target !== dialog) return
      event.preventDefault()
      close()
    })
    // Whatever else closed it, the owner is told rather than left holding a
    // mounted component that is invisible and owns the top layer.
    dialog.addEventListener("close", event => {
      if (event.target !== dialog) return
      if (locked) return dialog.showModal()
      close()
    })
    if (!parent) return dialog.showModal()

    // ESC is the parent's `cancel` while the parent is the modal, so it is
    // taken first, on the way down, and spent on the child.
    escape = event => {
      if (event.key !== "Escape" || !dialog.open || leaving) return
      event.preventDefault()
      event.stopPropagation()
      close()
    }
    window.addEventListener("keydown", escape, true)
    // A frame later, so the box above is drawn — headless and in its place —
    // before it is on screen.
    requestAnimationFrame(() => {
      if (!dialog.isConnected || dialog.open) return
      veil(dialog, $self(".veil"))
      dialog.show()
    })
  }
  show()
</script>

<!-- `@click.self` is the backdrop: a click that lands on the dialog itself
     rather than on anything inside it is a click outside the box, because the
     dialog has no padding of its own for a click to land in. -->
<!-- A child's overlay, over the parent's body and not its head. -->
<div :if="parent" class="veil" :class.closing="leaving" :style="box" @click="close()"></div>
<dialog class="modal" :class.closing="leaving" :class.child="!!parent" :class.folio="isFolio" :style="box"
        :aria-label="title" @click.self="close()">
  <header :if="!parent" class="modal-head">
    <strong>{{ title }}</strong>
    <slot.head />
    <!-- An icon, and the word kept for whoever cannot see it. -->
    <button :if="!locked" type="button" class="close" title="Close" @click="close()">
      <svg class="ic"><use href="#i-close"/></svg><span class="unseen">close</span>
    </button>
  </header>
  <div :if="parent && title" class="child-head">
    <div class="child-title-wrap">
      <span class="child-bullet"></span>
      <strong class="child-title">{{ title }}</strong>
    </div>
    <button :if="!locked" type="button" class="close" title="Close" @click="close()">
      <svg class="ic"><use href="#i-close"/></svg><span class="unseen">close</span>
    </button>
  </div>
  <slot />
</dialog>
