<script :setup="{
  options = [],
  model = undefined,
  value = '',
  placeholder = '',
  disabled = false,
  size = '',
  width = '',
  warn = false,
  invalid = false,
  id = '',
  name = '',
  selectClass = ''
}">
  // A select dropdown with custom chevron, unified borders and dark/light styling.
  // Supports an options array or direct <option> elements via default slot.
  //
  // **Self-contained**, like everything in `components/`: imports nothing.
  //
  //   <SelectInput :options="BACKENDS" :model="backend" />
  //   <SelectInput :model="toolCalls">
  //     <option value="">fenced</option>
  //     <option value="native">native</option>
  //   </SelectInput>
  //
  // An option is a string or `{ value, label, disabled, title }`.

  $: items = options.map(o => typeof o === "string" ? { value: o, label: o } : o)
  $: val = (model !== undefined && model !== null) ? model : value

  const onChange = event => {
    const v = event.target.value
    $updateModel(v)
    $emit("change", v)
  }
</script>

<div class="select-wrap"
     :class.small="size === 'small'"
     :class.warn="warn"
     :class.invalid="invalid"
     :class.disabled="disabled"
     :style="width ? `width:${width}` : ''">
  <select
    :class="selectClass || null"
    :value="val"
    :disabled="disabled"
    :id="id || null"
    :name="name || null"
    @change="onChange($event)"
    @focus="$emit('focus', $event)"
    @blur="$emit('blur', $event)">
    <option :if="placeholder" value="" disabled :selected="!val">{{ placeholder }}</option>
    <option :each="item in items"
            :key="String(item.value)"
            :value="item.value"
            :disabled="item.disabled"
            :title="item.title || null">
      {{ item.label }}
    </option>
    <slot></slot>
  </select>
  <svg class="caret" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7 10 12 15 17 10" />
  </svg>
</div>
